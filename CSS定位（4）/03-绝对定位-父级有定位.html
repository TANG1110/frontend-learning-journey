<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绝对定位-父级有定位</title>
    <style>
        .grandfather{
            position:relative;
            width: 800px;
            height: 800px;
            background-color: skyblue;
            padding: 50px;
        }
        .father {
            /* position: relative; */
            width: 500px;
            height: 500px;
            background-color: deeppink;
        }

        .son {
            position: absolute;
            bottom: 0px;
            left: 0px;
            /* top: 100px;
            left: 100px; */
            width: 200px;
            height: 200px;
            background-color: pink;
        }
    </style>
</head>

<body>
    <div class="grandfather">
        <div class="father">
            <div class="son"></div>
        </div>

    </div>
    
</body>

</html>
