<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定位堆叠顺序z-index</title>
    <style>
        .box{
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
        }
        .xiongda{
            background-color: rgb(235, 23, 23);
            z-index: 1;
        }
        .xionger{
            background-color: rgb(56, 205, 56);
            z-index: 2;
            left: 50px;
            top: 50px;
        }
        .qiangge{
            background-color: rgb(57, 57, 189);
            left: 100px;
            top: 100px;
        }
    </style>
</head>
<body>
    <div class="box xiongda">熊大</div>
    <div class="box xionger">熊二</div>
    <div class="box qiangge">光头强</div>

</body>
</html>
