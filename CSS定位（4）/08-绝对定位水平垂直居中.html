<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=., initial-scale=1.0">
    <title>绝对定位水平垂直居中</title>
    <style>
        .box{
            position:absolute;
            /* 1.left走50%父容器宽度的一半 */
            left: 50%;
            /* 2.margin负值往左边走 自己盒子宽度的一半 */
            width: 200px;
            height: 200px;
            background-color: pink;
            /* margin: 0 auto; */
        }
    </style>
</head>

<body>
    <div class="box"></div>
</body>
</html>
