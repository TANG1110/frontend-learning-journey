<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础选择器之类选择器</title>
    <style>
        /* 类选择器口诀：样式点定义，结构类（class)调用 一个或多个 开发最常用 */
        .suibian {
            color: red;
        }

        .star-sing {
            color: green;

        }
    </style>
</head>

<body>
    <ul>
        <li class="suibian">冰心</li>
        <li>来生缘</li>
        <li class="suibian">生僻字</li>
        <li class="star-sing">江南style</li>

    </ul>
    <div class="suibian">我也想变红色</div>
</body>

</html>
