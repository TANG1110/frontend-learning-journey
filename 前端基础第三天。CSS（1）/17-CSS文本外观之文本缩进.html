<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS文本外观之文本缩进</title>
    <style>
        p {
            /* 文本的第一行首行缩进 多少距离 */
            /* text-indent: 20px; */
            /* 如果此时写了2em 则是缩进当前元素 2个文字的距离 */
            text-indent: 2em;
        }
    </style>
</head>

<body>
    <p>唐xy是个大肥猪,为什么呢,请看下一段</p>
    <p>因为她一写作业就嘴馋</p>
    <p>她天天吃饭想吃她兄弟的瘦肉</p>
</body>

</html>
