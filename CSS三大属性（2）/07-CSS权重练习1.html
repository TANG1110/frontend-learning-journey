<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS权重练习</title>
    <style>
        .nav {
            color: red;

        }

        /* 继承的权重是0 */
        li {
            color: pink;
        }
    </style>
</head>

<body>
    <ul class="nav">
        <li>
            咏鹅
        </li>
        <li>
            鹅，鹅，鹅，</li>
        <li>
            曲项向天歌。
        </li>
        <li>
            白毛浮绿水</li>
        <li>
            红掌拨清波。
        </li>
    </ul>
</body>

</html>
