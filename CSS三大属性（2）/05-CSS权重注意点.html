<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS权重注意点</title>
    <style>
        body {
            color: yellow;
        }

        #father {
            color: orange !important;
        }

        /* 继承的权重为0 */
        p {
            color: pink;
        }

        /* 链接浏览器默认制定了一个样式，蓝色的 有下划线 a{color:blue} */
        a {
            color: rgb(46, 152, 134);
        }
    </style>
</head>

<body>
    <div id="father">
        <p>你还是很好看</p>
    </div>
    <a href="#">我是单独的样式</a>
</body>

</html>
