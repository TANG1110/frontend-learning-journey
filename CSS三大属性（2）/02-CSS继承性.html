<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS继承性</title>
    <style>
        div {
            color: blue;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div>
        <p>
            龙生龙，凤生凤，老鼠的儿子会打洞。
        </p>
    </div>
</body>

</html>
