<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS优先级</title>
    <style>
        div {
            color: pink !important;
        }

        .text {
            color: red;
        }

        #demo {
            color: green;
        }
    </style>
</head>

<body>
    <div class="text" id="demo" style="color:purple">没事就吃溜溜梅</div>
</body>

</html>
