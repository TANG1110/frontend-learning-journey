<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行高的继承</title>
    <style>
        行高为18 body {
            color: rgb(19, 29, 212);
            font-size: 18px/1.5 Microsoft YaHei;
        }

        /* div的行高为14*1.5=21 */
        div {
            font-size: 14px;
            color: purple;
        }

        /* p的行高为16*1.5=24 */
        p {
            color: pink;
            font-size: 16px;
        }

        /* li没有设置行高，继承自body，为18*1.5=27 */
    </style>
</head>

<body>
    <div>
        一人传虚，百人传实。

    </div>
    <p>
        粉色泡泡
    </p>
    <ul>
        <li>没有设置格式</li>
    </ul>
</body>

</html>
