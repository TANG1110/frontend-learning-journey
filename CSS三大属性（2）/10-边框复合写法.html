<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型之边框</title>
    <style>
        div {
            width: 200px;
            height: 100px;
            /* border-width 表边框粗细 一般情况下都用 px
            border-width: 15px;
            /* border-style 表边框样式  solid表实线 dashed表虚线 dotted表点线*/
            /* border-style: solid; */
            /* border-style: dashed; */
            /* border-style: dotted; */
            /* border-color: 表边框颜色 */
            /* border-color: pink; */
            /* 边框的符合写法： */
            /* border: 5px solid blue; */
            /* 上边框 */
            border-top: 5px solid blue;
            /* 下边框 */
            border-bottom: 5px dotted red;
        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
