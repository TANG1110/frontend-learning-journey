<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS权重练习</title>
    <style>
        /* nav li 权重是11 */
        .nav li {
            color: red;
        }

        /* 需要把第一个小li变为粉红色加粗 */
        /* 权重是10 */
        /* .nav .qink  20 */
        .nav .pink {
            color: pink;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <ul class="nav">
        <li class="pink">
            咏鹅
        </li>
        <li>
            鹅，鹅，鹅，</li>
        <li>
            曲项向天歌。
        </li>
        <li>
            白毛浮绿水</li>
        <li>
            红掌拨清波。
        </li>
    </ul>
</body>

</html>
