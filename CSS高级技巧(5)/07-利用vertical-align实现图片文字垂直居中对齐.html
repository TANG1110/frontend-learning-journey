<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>利用vertical-align实现图片文字垂直居中对齐</title>
    <style>
        img{
            /* vertical-align: bottom; */
            /* 让图片和文字垂直居中 */
            vertical-align: middle;
            /* vertical-align: top; */
        }

        textarea{
            vertical-align:middle;
            resize: none;
        }
    </style>
</head>
<body>
    <img src="images/ldh.webp" alt="">刘德华年轻照片
    <br>
    <textarea name="" id="" cols="30" rows="10">请您留言</textarea>
</body>
</html>
