<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浮动特性-浮动盒子一行显示</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: pink;
            float: left
        }

        .two {
            background-color: green;
            height: 249px;
        }

        .four {
            background-color: blue;

        }
    </style>
</head>

<body>
    <div class="one"></div>
    <div class="two"></div>
    <div class="three"></div>
    <div class="four"></div>
</body>

</html>
