<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子阴影</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: pink;

            margin: 100px auto;
        }

        div:hover {
            /* 水平偏移距离 垂直偏移距离 模糊距离 阴影颜色 */
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>
    <div></div>
</body>

</html>
