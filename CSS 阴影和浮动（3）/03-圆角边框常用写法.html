<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圆角边框常用写法</title>
    <style>
        .yuanxing {
            width: 200px;
            height: 200px;
            background-color: pink;
            /* border-radius: 100px; */
            /* 50%就是宽高的一半，设置成50%就可以了  */
            border-radius: 50%;
        }

        .yuanjiao {
            width: 300px;
            height: 100px;
            background-color: lightblue;
            /* 圆角矩形设置为高度的一半 */
            border-radius: 50px;
        }

        .radius {
            width: 300px;
            height: 100px;
            background-color: lightgreen;
            border-radius: 20px 0 20px 0;
        }
    </style>
</head>

<body>
    1.圆形的做法：
    <div class="yuanxing">
    </div>
    2.矩形变圆角框的做法：
    <div class="yuanjiao">
    </div>
    3.四角不同的圆角框的做法：
    <div class="radius">
    </div>
</body>

</html>
